</style></head><body><main class="ops"><aside class="sidebar"><img src="../Assets/PNG/White Label.png" alt="DONECASH"><div class="side-label">OPERATIONS CONSOLE · SIMULATED DATA</div><nav id="nav"></nav><div class="user"><b>Mona Adel</b><small>Fraud analyst · Shift A</small></div></aside><section class="main"><header class="topbar"><span id="crumb" class="muted">Operations / Overview</span><div class="top-actions"><input class="search" placeholder="Exact phone, customer or reference…" aria-label="Global search"><button class="dc-btn">⌘ K</button><a class="dc-btn primary" href="index.html" style="display:grid;place-items:center;text-decoration:none">Prototype hub</a></div></header><div class="pagehead"><div><h1 class="display" id="title">OPERATIONS. UNDER CONTROL.</h1><p id="subtitle"></p></div><div id="page-actions"></div></div><div id="page"></div></section></main><script>

'customer-search':{group:'CUSTOMERS',title:'Customer search',subtitle:'Exact-match access with masking, purpose and audit.',body:()=>`<div class="toolbar"><input class="search" value="010 1234 2381"><button class="dc-btn primary" data-route="customer-360">Search with reason</button><span class="badge">Reason: Support case</span></div>${tbl(['Customer','Mobile','Wallet','KYC','Risk','Action'],[['Mariam Hassan','010 •••• 2381',badge('ACTIVE','success'),'Level 2',badge('STANDARD'),'<button data-route="customer-360">Open 360°</button>'],['Mariam Hussein','010 •••• 9002',badge('RESTRICTED','danger'),'Level 1',badge('HIGH','risk'),'<button data-route="customer-360">Open 360°</button>']])}<p class="footnote">Every search and profile open is recorded with actor, reason, time and result count.</p>`},

'risk-case':{group:'KYC & RISK',title:'Risk case RC-004219',subtitle:'Linked alerts, evidence and controlled wallet actions.',body:()=>`<div class="split">${panel('Case evidence',`${factGrid([['Priority','CRITICAL'],['Customer','Mariam Hassan'],['Wallet','ACTIVE · 2,160.75 EGP'],['Active hold','420.50 EGP'],['Assigned to','Mona Adel'],['SLA','08:14 remaining']])}<h3>Linked signals</h3><div class="rule"><h3>New device + high value</h3><p>Rule R-18 v7 · score 92 · 10:42</p></div><div class="rule"><h3>PIN reset within 24h</h3><p>Rule ATO-04 v3 · score contribution 18</p></div>`)}${panel('Investigation and action',`<div class="timeline"><div class="event"><b>Alert grouped into case</b><small>System · 10:42</small></div><div class="event"><b>Profile viewed with reason</b><small>Mona Adel · 10:44</small></div></div><div class="dc-field"><label>Analyst notes</label><textarea>Device verified through step-up. Reviewing recipient novelty.</textarea></div><div class="toolbar" style="margin-top:12px"><button class="dc-btn primary">Close as safe</button><button class="dc-btn">Request wallet hold</button><button class="dc-btn danger">Escalate</button></div><p class="footnote">A wallet hold creates an approval request; it does not directly mutate the wallet.</p>`)}</div>`},

'ticket-workspace':{group:'SUPPORT',title:'Ticket workspace',subtitle:'Conversation, customer context and safe actions without ledger access.',body:()=>`<div class="split">${panel('Customer conversation',`<div class="rule"><h3>Customer · 10:48</h3><p>My ATM withdrawal is still showing as processing, but no cash came out.</p></div><div class="rule" style="background:var(--dc-khaki)"><h3>Support · draft</h3><p>We are checking the ATM provider confirmation. Do not create another withdrawal request yet.</p></div><div class="dc-field"><label>Reply to customer</label><textarea>We’re checking your withdrawal status and will update you by 14:30.</textarea></div><button class="dc-btn primary" style="margin-top:10px">Send reply</button>`)}${panel('Safe context',`${factGrid([['Customer','Mahmoud A.'],['Wallet','ACTIVE'],['Transaction','DC-72AC10'],['Amount','505.00 EGP'],['Status','PROCESSING'],['Provider','Meeza ATM']])}<div class="notice info"><b>Provider poll</b><br>Last checked 28 seconds ago · no final status.</div><div class="toolbar"><button class="dc-btn" data-route="transaction-trace">Open trace</button><button class="dc-btn">Escalate to payments</button></div><p class="footnote">Support cannot edit the ledger, force completion or view OTP/MPIN.</p>`)}</div>`},
'recon-batches':{group:'FINANCE',title:'Reconciliation batches',subtitle:'Provider files, totals, integrity and processing status.',body:()=>`${stats([['Today received','12','11 complete'],['Matched','99.92%','718k items'],['Exceptions','7','12,405.50 EGP'],['Oldest break','1h 42m','Electricity']])}${tbl(['Batch','Provider','Business date','Items','Amount','Status','Action'],[['REC-240913-ELEC','Electricity','13 Sep 2026','82,104','18,420,882.50',badge('REVIEW','processing'),'<button data-route="recon-exceptions">7 exceptions</button>'],['REC-240913-MEEZA','Meeza','13 Sep 2026','129,882','94,204,100.00',badge('COMPLETED','success'),'<button>Open</button>'],['REC-240913-SMS','SMS provider','13 Sep 2026','244,912','—',badge('COMPLETED','success'),'<button>Open</button>']])}`},

const navGroups=[['OPERATIONS',['overview','provider-health']],['CUSTOMERS',['customer-search','customer-360']],['KYC & RISK',['kyc-queue','kyc-review','risk-alerts','risk-case']],['TRANSACTIONS',['transactions','transaction-trace']],['SUPPORT',['support-queue','ticket-workspace']],['FINANCE',['recon-batches','recon-exceptions']],['POLICIES',['fee-policies','limit-policies','risk-rules','notification-templates']],['GOVERNANCE',['approvals','staff-roles','reports','audit']]];
const labels={'overview':'Overview','provider-health':'Provider health','customer-search':'Customer search','customer-360':'Customer 360','kyc-queue':'KYC queue','kyc-review':'KYC review','risk-alerts':'Risk alerts','risk-case':'Risk case','transactions':'Transactions','transaction-trace':'Transaction trace','support-queue':'Support queue','ticket-workspace':'Ticket workspace','recon-batches':'Reconciliation','recon-exceptions':'Recon exceptions','fee-policies':'Fee policies','limit-policies':'Limit policies','risk-rules':'Risk rules','notification-templates':'Notification templates','approvals':'Approvals','staff-roles':'Staff & roles','reports':'Reports','audit':'Audit'};
document.getElementById('nav').innerHTML=navGroups.map(([g,rs])=>`<div class="side-label">${g}</div>${rs.map(r=>`<button class="nav-link" data-route="${r}"><span>${labels[r]}</span><span>›</span></button>`).join('')}`).join('');
let current='overview';function go(name){if(!routes[name])return;current=name;const r=routes[name];document.getElementById('title').textContent=r.title.toUpperCase();document.getElementById('subtitle').textContent=r.subtitle;document.getElementById('crumb').textContent=`Operations / ${r.group} / ${r.title}`;document.getElementById('page').innerHTML=r.body();document.querySelectorAll('.nav-link').forEach(b=>b.classList.toggle('active',b.dataset.route===name));document.querySelectorAll('#page [data-route]').forEach(b=>b.onclick=()=>go(b.dataset.route));location.hash=name;}
document.addEventListener('click',e=>{const b=e.target.closest('.nav-link[data-route]');if(b)go(b.dataset.route)});window.addEventListener('hashchange',()=>go(location.hash.slice(1)||'overview'));window.__prototype={routes:Object.keys(routes),count:Object.keys(routes).length,go};go(location.hash.slice(1)||'overview');
</script></body></html>
